format = "csv"
delimiter = ","
availability = "current"
required = true
grain = "mixed_admin_unit_year_season"
expected_rows = 732
required_columns = [
  "District",
  "fclass",
  "Year",
  "season",
  "AirTemp_C",
  "TreeCover_Pct",
  "Landsat_LST_C",
  "Gestorbene",
]
known_warning = "This is a preliminary 2015/2020/2025 mixed-administrative snapshot with undocumented derivation; mortality values are not heat-attributed outcomes."

[datasets.lor_equity_environment_2024]
label = "LOR social status and environmental justice indicators"
