[manifest]
version = 1
updated = "2026-10-17"
description = "Dataset registry for the October 2026 seminar proposal and existing preliminary evidence."

[datasets.recorded_watering_events]
label = "Gieß den Kiez recorded citizen-watering events"
path = "data/giessdenkiez_bew\u00e4sserungsdaten (1).csv"
format = "csv"
delimiter = ";"
availability = "current"
required = true
grain = "recorded_watering_event"
expected_rows = 58847
required_columns = [
  "id",
  "lng",
  "lat",
  "bezirk",
  "art_dtsch",
  "gattung_deutsch",
  "strname",
  "pflanzjahr",
  "timestamp",
  "bewaesserungsmenge_in_liter",
]
source = "Berlin Open Data / CityLAB Berlin"
license = "CC0"
snapshot_end = "2026-04-30"

[datasets.tree_inventory]
label = "Berlin tree inventory"
path = "data/Berlin_trees.gpkg"
format = "gpkg"
availability = "optional-local"
required = false
grain = "tree"
expected_layer = "Berlin_trees"
required_layers = ["Berlin_trees"]
expected_rows = 962545
expected_srs_id = 4326
analysis_srs_id = 25833
known_warning = "Source metadata declares EPSG:4326 although the stored coordinates are EPSG:25833; analysis must override the metadata explicitly."
required_columns = [
  "pitid",
  "bezirk",
  "source_layer",
  "pflanzjahr",
  "standalter",
  "art_dtsch",
  "gattung_deutsch",
]

[datasets.lor_boundaries_2021]
label = "Berlin LOR Planungsräume 2021"
path = "data/spatial/lor_planungsraeume_2021.gpkg"
format = "gpkg"
availability = "current"
required = true
grain = "planungsraum"
expected_layer = "a_lor_plr_2021"
required_layers = ["a_lor_plr_2021"]
expected_rows = 542
expected_srs_id = 25833
required_columns = [
  "plr_id",
  "plr_name",
  "bzr_id",
  "bzr_name",
  "bez",
]
source = "Amt für Statistik Berlin-Brandenburg"
license = "CC BY 3.0 DE"
reference_date = "2021-01-01"

[datasets.legacy_heat_borough_snapshot]
